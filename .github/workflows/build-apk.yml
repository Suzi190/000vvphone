name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'manifest.json'
      - 'icon.png'
      - 'favicon.ico'
      - 'i/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vvphone-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 debug.keystore，保证多次构建的签名一致，便于覆盖安装保留数据
      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vvphone-debug-keystore-v1

      - name: Prepare web assets
        run: |
          set -e
          mkdir -p android/app/src/main/assets/www
          cp index.html script.js style.css manifest.json icon.png favicon.ico android/app/src/main/assets/www/
          if [ -d i ]; then cp -r i android/app/src/main/assets/www/; fi
          ls -la android/app/src/main/assets/www

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PvvVersionCode=${{ github.run_number }} \
            -PvvVersionName=1.0.${{ github.run_number }}

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/VVPhone.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/VVPhone-${{ github.run_number }}.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVPhone-Android-APK-${{ github.run_number }}
          path: out/VVPhone-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: VVPhone Android APK
          overwrite_files: true
          body: |
            **本次构建：1.0.${{ github.run_number }}（versionCode ${{ github.run_number }}）**

            请下载 `VVPhone-${{ github.run_number }}.apk` —— 文件名自带版本号，不会被浏览器/CDN 缓存成旧包。
            `VVPhone.apk` 也指向最新构建，但缓存较顽固，遇到「怎么装都还是老问题」时请改用带版本号的文件。

            本版修复：键盘弹起/收起时输入框还在上下跳、底部还露黑边。
            根因不在缓动曲线，而是 1.0.9~1.0.11 一直在为键盘**改 WebView 的尺寸**：
            WebView 一 resize，Chromium 就要重建绘制 surface，键盘动画期间每帧都掉帧、
            露出整片黑帧；而且键盘窗口自己的动画和系统的 insets 动画在不少机型（三星很典型）上
            是两套曲线，内容和键盘永远对不齐——怎么调缓动都是「输入框跳 + 黑边」。
            现在：WebView 尺寸**一动不动**，只把键盘高度推给页面（CSS 变量 `--vv-kb`），
            由页面压 `.phone-case` 的底部内边距来让位；每次键盘变化只推**一次最终高度**
            （不再逐帧推，逐帧推就是逐帧整页重排，ROM 上报的 inset 一抖输入框就窜），
            平滑交给 150ms 的 CSS 过渡；让位区颜色跟随当前页面背景（透明则退成白色），
            不会再露出一条黑边；另加一层窗口高度检测，万一某 ROM 仍自行缩小窗口，
            就放弃页面让位，避免双重避让把输入框顶到屏幕中间。
            顺带把 `adjustNothing` 改回 `adjustResize`：Android 11+ 因为已经 edge-to-edge，
            系统照样不会 resize 窗口；Android 7~10 则恢复系统原生避让，那些机型上键盘不会盖住输入框。

            上一版修复：逐帧 padding 原本**线性**跟随 insets 动画，键盘跟不上时底部会露底色，
            于是改成「方向性缓动」（弹出时内容比键盘慢半拍，收起时内容先落回去），
            并删掉了页面里那层会压矮 `body` 的 `visualViewport` 兜底
            （`body` 是 flex 居中，压矮后 `.phone-case` 上下同时收缩 = 黑边 + 上下跳）。

            上一版修复：为了避开挖孔，把刘海安全区做成了顶部内边距；padding 挪到外层容器后
            WebView 是**真的往下缩**，屏幕顶端就露出一条黑边（看着就是"不全屏了"）。
            现在顶部一律不加内边距，页面直接铺满整屏，挖孔只盖住中间那块空白（页面假状态栏的
            时间和电量分列左右两端，不会互相遮挡）；另外在 `setContentView` 之后再强制隐藏一次
            系统栏，避免更换 contentView 时状态栏重新冒出来。

            更早修复：软键盘遮挡。沉浸式（edge-to-edge）下系统不再替应用压缩窗口，
            而原来是把键盘高度加在 WebView **自己**身上的内边距——Chromium 的 viewport 取的是
            View 的整体尺寸（含 padding），页面里的 `100vh` 并不会跟着键盘变化，底部输入框照样被盖住。
            现在改成给 WebView 的**外层容器**加底部 padding：WebView 的测量高度真的变矮，
            `100vh` 与底栏 flex 布局随之上移。

            更早修复：启动时隐藏系统栏在 DecorView 创建之前调用 `Window.getInsetsController()`
            导致的 `NullPointerException`（三星 Android 13 / API 33 上必崩）。
            覆盖安装即可保留数据；若上次崩溃记录还在，进入闸门页点「清空记录并重试」。

            - 启动闸门：连续崩溃时显示可复制的崩溃堆栈与启动轨迹，主界面不再无声闪退
            - 启动页显示版本号 / Android 版本 / WebView 版本，可直接确认装的是新包
            - 全屏沉浸式：隐藏系统状态栏与导航栏
            - 数据导出：保存到手机「下载/VVPhone」目录
            - 数据导入：支持选择本地 JSON 备份文件
            - 返回键与左边缘右滑：逐层返回（弹层 → 聊天 → 桌面 → 后台）

            安装提示：首次安装需允许「安装未知来源应用」；覆盖安装可保留数据。
          files: |
            out/VVPhone.apk
            out/VVPhone-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
