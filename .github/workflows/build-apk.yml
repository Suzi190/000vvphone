name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'manifest.json'
      - 'icon.png'
      - 'favicon.ico'
      - 'i/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vvphone-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 debug.keystore，保证多次构建的签名一致，便于覆盖安装保留数据
      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vvphone-debug-keystore-v1

      - name: Prepare web assets
        run: |
          set -e
          mkdir -p android/app/src/main/assets/www
          cp index.html script.js style.css manifest.json icon.png favicon.ico android/app/src/main/assets/www/
          if [ -d i ]; then cp -r i android/app/src/main/assets/www/; fi
          ls -la android/app/src/main/assets/www

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PvvVersionCode=${{ github.run_number }} \
            -PvvVersionName=1.0.${{ github.run_number }}

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/VVPhone.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/VVPhone-${{ github.run_number }}.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVPhone-Android-APK-${{ github.run_number }}
          path: out/VVPhone-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: VVPhone Android APK
          overwrite_files: true
          body: |
            **本次构建：1.0.${{ github.run_number }}（versionCode ${{ github.run_number }}）**

            请下载 `VVPhone-${{ github.run_number }}.apk` —— 文件名自带版本号，不会被浏览器/CDN 缓存成旧包。
            `VVPhone.apk` 也指向最新构建，但缓存较顽固，遇到「怎么装都还是老问题」时请改用带版本号的文件。

            本版修复：输入框仍被键盘挡住（1.0.13 把单位修对后暴露的下一个坑）。
            页面让位本身是对的（用 headless 实测过：kb=330 时输入框底边 409、键盘顶 419，
            正好落在键盘上方），问题在「原生 → 页面」这一跳：键盘高度只靠
            `evaluateJavascript` 推送，一旦 insets 回调不来、或推送时页面 JS 上下文还没就绪，
            页面就永远收不到值，`--vv-kb` 一直是 0，输入框自然被挡住。
            现在加了第二条**同步拉取**通道：页面在输入框获得焦点后用
            `VVAndroid.getKeyboardHeight()` 直接问原生（180/380/650/1000ms 各问一次），
            不依赖推送；原生在 ime inset 明显小于「窗口可见区域底边距」时也会用后者校正。

            上上版修复：键盘弹起后键盘上方整片空白——`WindowInsets` 是物理像素，
            却被当成 CSS px 推给页面，高 DPI 屏上放大 2~3 倍，把内容区压成 0。

            上一版修复：键盘弹起/收起时输入框上下跳、底部露黑边。根因不在缓动曲线，
            而是 1.0.9~1.0.11 一直在为键盘**改 WebView 的尺寸**：WebView 一 resize，
            Chromium 就要重建绘制 surface，键盘动画期间每帧掉帧、露黑帧；键盘窗口自己的
            动画和系统的 insets 动画在不少机型（三星很典型）上还是两套曲线，内容永远追不上键盘。
            现在 WebView 尺寸一动不动，只把键盘高度推给页面，由页面压 `.phone-case` 的底部内边距
            让位，露出的颜色跟随页面背景（不会再是黑边）；每次键盘变化只推一次最终高度，
            并加了窗口高度检测，避免个别 ROM 双重避让。

            上一版修复：为了避开挖孔，把刘海安全区做成了顶部内边距；padding 挪到外层容器后
            WebView 是**真的往下缩**，屏幕顶端就露出一条黑边（看着就是"不全屏了"）。
            现在顶部一律不加内边距，页面直接铺满整屏，挖孔只盖住中间那块空白（页面假状态栏的
            时间和电量分列左右两端，不会互相遮挡）；另外在 `setContentView` 之后再强制隐藏一次
            系统栏，避免更换 contentView 时状态栏重新冒出来。

            更早修复：软键盘遮挡。沉浸式（edge-to-edge）下系统不再替应用压缩窗口，
            而原来是把键盘高度加在 WebView **自己**身上的内边距——Chromium 的 viewport 取的是
            View 的整体尺寸（含 padding），页面里的 `100vh` 并不会跟着键盘变化，底部输入框照样被盖住。
            现在改成给 WebView 的**外层容器**加底部 padding：WebView 的测量高度真的变矮，
            `100vh` 与底栏 flex 布局随之上移。

            更早修复：启动时隐藏系统栏在 DecorView 创建之前调用 `Window.getInsetsController()`
            导致的 `NullPointerException`（三星 Android 13 / API 33 上必崩）。
            覆盖安装即可保留数据；若上次崩溃记录还在，进入闸门页点「清空记录并重试」。

            - 启动闸门：连续崩溃时显示可复制的崩溃堆栈与启动轨迹，主界面不再无声闪退
            - 启动页显示版本号 / Android 版本 / WebView 版本，可直接确认装的是新包
            - 全屏沉浸式：隐藏系统状态栏与导航栏
            - 数据导出：保存到手机「下载/VVPhone」目录
            - 数据导入：支持选择本地 JSON 备份文件
            - 返回键与左边缘右滑：逐层返回（弹层 → 聊天 → 桌面 → 后台）

            安装提示：首次安装需允许「安装未知来源应用」；覆盖安装可保留数据。
          files: |
            out/VVPhone.apk
            out/VVPhone-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
