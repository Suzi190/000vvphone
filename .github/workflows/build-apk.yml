name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'manifest.json'
      - 'icon.png'
      - 'favicon.ico'
      - 'i/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vvphone-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 debug.keystore，保证多次构建的签名一致，便于覆盖安装保留数据
      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vvphone-debug-keystore-v1

      - name: Prepare web assets
        run: |
          set -e
          mkdir -p android/app/src/main/assets/www
          cp index.html script.js style.css manifest.json icon.png favicon.ico android/app/src/main/assets/www/
          if [ -d i ]; then cp -r i android/app/src/main/assets/www/; fi
          ls -la android/app/src/main/assets/www

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PvvVersionCode=${{ github.run_number }} \
            -PvvVersionName=1.0.${{ github.run_number }}

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/VVPhone.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VVPhone-Android-APK
          path: out/VVPhone.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: VVPhone Android APK
          overwrite_files: true
          body: |
            VVPhone 安卓安装包（GitHub Actions 自动构建）

            - 全屏沉浸式：隐藏系统状态栏与导航栏
            - 数据导出：保存到手机「下载/VVPhone」目录
            - 数据导入：支持选择本地 JSON 备份文件
            - 返回键：先回到桌面，再按一次退出

            安装提示：首次安装需允许「安装未知来源应用」。
          files: out/VVPhone.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
